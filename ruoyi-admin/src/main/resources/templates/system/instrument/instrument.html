<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:include="include :: header('仪器信息管理')" />
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-sm-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5>仪器信息管理</h5>
                    <div class="ibox-tools">
                        <a class="btn btn-primary btn-xs" th:href="@{/system/instrument/add}"><i class="fa fa-plus"></i> 新增</a>
                    </div>
                </div>
                <div class="ibox-content">
                    <!-- 搜索区域：严格按照若依原生格式 -->
                    <div class="row">
                        <div class="col-sm-12 search-collapse">
                            <form id="formId">
                                <div class="select-list">
                                    <ul>
                                        <li>
                                            <label>仪器名称：</label>
                                            <input type="text" name="instrumentName" placeholder="请输入仪器名称"/>
                                        </li>
                                        <li>
                                            <label>仪器编号：</label>
                                            <input type="text" name="instrumentCode" placeholder="请输入仪器编号"/>
                                        </li>
                                        <li>
                                            <label>状态：</label>
                                            <select name="status">
                                                <option value="">全部</option>
                                                <option value="0">正常</option>
                                                <option value="1">维修</option>
                                                <option value="2">报废</option>
                                                <option value="3">停用</option>
                                            </select>
                                        </li>
                                        <li>
                                            <!-- 【关键】直接用若依原生的 $.table.search() 和 $.form.reset() -->
                                            <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                            <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                                        </li>
                                    </ul>
                                </div>
                            </form>
                        </div>
                    </div>

                    <!-- 数据表格 -->
                    <table id="bootstrap-table" data-mobile-responsive="true"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:include="include :: footer" />

<script>
    var prefix = "/system/instrument";

    $(function() {
        var options = {
            url: prefix + "/list",
            createUrl: prefix + "/add",
            updateUrl: prefix + "/edit/{id}",
            removeUrl: prefix + "/remove",
            modalName: "仪器",
            // 【关键】若依会自动把 id="formId" 表单里的参数带过去，不需要手动写 queryParams
            columns: [
                {checkbox: true},
                {field: 'instrumentId', title: '仪器ID', visible: false},
                {field: 'instrumentName', title: '仪器名称'},
                {field: 'instrumentCode', title: '仪器编号'},
                {field: 'deptName', title: '所属院系'},
                {field: 'location', title: '存放位置'},
                {
                    field: 'status',
                    title: '状态',
                    align: 'center',
                    formatter: function(value) {
                        if (value == '0') return '<span class="label label-primary">正常</span>';
                        if (value == '1') return '<span class="label label-info">维修</span>';
                        if (value == '2') return '<span class="label label-danger">报废</span>';
                        if (value == '3') return '<span class="label label-warning">停用</span>';
                        return value;
                    }
                },
                {field: 'purchaseTime', title: '采购时间'},
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row) {
                        var actions = [];
                        actions.push('<a class="btn btn-primary btn-xs" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.instrumentId + '\')"><i class="fa fa-edit"></i> 修改</a> ');
                        actions.push('<a class="btn btn-danger btn-xs" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.instrumentId + '\')"><i class="fa fa-trash"></i> 删除</a>');
                        return actions.join('');
                    }
                }
            ]
        };
        $.table.init(options);
    });
</script>
</body>
</html>
