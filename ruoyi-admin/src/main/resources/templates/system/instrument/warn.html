<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>仪器异常阈值预警</title>
    <th:block th:include="include :: header('仪器异常阈值预警')"></th:block>
</head>
<body class="gray-bg">
<div class="wrapper wrapper-content animated fadeInRight">
    <!-- 预警规则配置 -->
    <div class="row">
        <div class="col-sm-6">
            <div class="ibox float-e-margins">
                <div class="ibox-title">预警规则配置</div>
                <div class="ibox-content">
                    <form id="ruleForm" class="form-horizontal">
                        <div class="form-group">
                            <label class="col-sm-2 control-label">仪器ID</label>
                            <div class="col-sm-10">
                                <input type="text" name="instrumentId" class="form-control" placeholder="0表示全局规则">
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">预警类型</label>
                            <div class="col-sm-10">
                                <select name="warnType" class="form-control">
                                    <option value="1">借用超期阈值(小时)</option>
                                    <option value="2">维修超时时长(天)</option>
                                    <option value="3">月使用频次阈值</option>
                                    <option value="4">维修费用阈值</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">阈值</label>
                            <div class="col-sm-10">
                                <input type="number" name="threshold" class="form-control" step="0.01" required>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="col-sm-2 control-label">通知方式</label>
                            <div class="col-sm-10">
                                <label><input type="radio" name="notifyType" value="1" checked> 系统消息</label>
                                <label><input type="radio" name="notifyType" value="2"> 邮件</label>
                                <label><input type="radio" name="notifyType" value="3"> 两者都有</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-4 col-sm-offset-2">
                                <button type="submit" class="btn btn-primary">保存规则</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- 预警记录列表 -->
        <div class="col-sm-6">
            <div class="ibox float-e-margins">
                <div class="ibox-title">预警记录</div>
                <div class="ibox-content">
                    <table class="table table-striped table-bordered table-hover">
                        <thead>
                        <tr>
                            <th>仪器名称</th>
                            <th>预警类型</th>
                            <th>预警内容</th>
                            <th>触发值</th>
                            <th>处理状态</th>
                            <th>操作</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="item : ${warnRecordList}">
                            <td th:text="${item.instrumentName}"></td>
                            <td th:switch="${item.warnType}">
                                <span th:case="1">借用超期</span>
                                <span th:case="2">维修超时</span>
                                <span th:case="3">使用频次超限</span>
                                <span th:case="4">维修费用超限</span>
                            </td>
                            <td th:text="${item.warnContent}"></td>
                            <td th:text="${item.triggerValue}"></td>
                            <td th:switch="${item.handleStatus}">
                                <span class="label label-danger" th:case="0">未处理</span>
                                <span class="label label-success" th:case="1">已处理</span>
                            </td>
                            <td>
                                <button class="btn btn-xs btn-primary" th:if="${item.handleStatus == '0'}"
                                        onclick="handleWarn('${item.recordId}')">处理</button>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:include="include :: footer"></th:block>
<script>
    // 保存预警规则
    $("#ruleForm").submit(function(e) {
        e.preventDefault();
        $.post("/instrument/warn/saveRule", $(this).serialize(), function(res) {
            if (res.code === 200) {
                layer.msg("规则保存成功");
                $("#ruleForm")[0].reset();
            } else {
                layer.msg(res.msg);
            }
        });
    });

    // 处理预警记录
    function handleWarn(recordId) {
        layer.prompt({title: '输入处理备注', formType: 2}, function(remark, index) {
            $.post("/instrument/warn/handle/" + recordId, {handleRemark: remark}, function(res) {
                if (res.code === 200) {
                    layer.msg("处理成功");
                    layer.close(index);
                    window.location.reload();
                } else {
                    layer.msg(res.msg);
                }
            });
        });
    }
</script>
</body>
</html>
