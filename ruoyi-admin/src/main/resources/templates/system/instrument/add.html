<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="include :: header('新增仪器')" />
  <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
  <!-- 🔥 修复：移除同步提交属性 th:action、method -->
  <form class="form-horizontal m-t" id="instrumentForm">
    <div class="form-group">
      <label class="col-sm-2 control-label">仪器名称：</label>
      <div class="col-sm-10">
        <input name="instrumentName" class="form-control" type="text" required placeholder="请输入仪器名称">
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">仪器编号：</label>
      <div class="col-sm-10">
        <input name="instrumentCode" class="form-control" type="text" required placeholder="请输入仪器编号">
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">所属院系：</label>
      <div class="col-sm-10">
        <select name="deptId" class="form-control" required>
          <option value="">请选择所属院系</option>
          <option th:each="dept : ${deptList}"
                  th:value="${dept.deptId}"
                  th:text="${dept.deptName}">
          </option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">仪器状态：</label>
      <div class="col-sm-10">
        <select name="status" class="form-control">
          <option value="0">正常</option>
          <option value="1">维修</option>
          <option value="2">报废</option>
          <option value="3">停用</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">规格型号：</label>
      <div class="col-sm-10">
        <input name="specs" class="form-control" type="text" placeholder="请输入规格型号">
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">生产厂家：</label>
      <div class="col-sm-10">
        <input name="manufacturer" class="form-control" type="text" placeholder="请输入生产厂家">
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">采购时间：</label>
      <div class="col-sm-10">
        <div class="input-group date">
          <input name="purchaseTime" class="form-control" type="text" readonly>
          <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">存放位置：</label>
      <div class="col-sm-10">
        <input name="location" class="form-control" type="text" placeholder="请输入存放位置">
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">备注：</label>
      <div class="col-sm-10">
        <textarea name="remark" class="form-control" rows="3" placeholder="请输入备注信息"></textarea>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-4 col-sm-offset-2">
        <!-- 🔥 修复：改为普通按钮，绑定异步提交 -->
        <button type="button" class="btn btn-primary" onclick="submitForm()">保存</button>
        <button type="button" class="btn btn-white" onclick="$.modal.close()">取消</button>
      </div>
    </div>
  </form>
</div>

<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />

<script>
  $(function() {
    $('.input-group.date').datetimepicker({
      format: 'yyyy-mm-dd',
      minView: 2,
      language: 'zh-CN',
      autoclose: true
    });
    $("#instrumentForm").validate({});
  });

  // 🔥 修复：若依标准异步提交（自动提示+关闭弹窗+刷新）
  function submitForm() {
    $.operate.save("/system/instrument/add", $("#instrumentForm").serialize());
  }
</script>
</body>
</html>
