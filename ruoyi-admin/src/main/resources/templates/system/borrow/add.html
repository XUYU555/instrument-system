<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="include :: header('新增借用申请')" />
  <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
  <form class="form-horizontal m-t" id="borrowForm" th:action="@{/system/borrow/add}" method="post">

    <!-- ===================== 自动填充仪器ID（只读，不可修改） ===================== -->
    <div class="form-group">
      <label class="col-sm-2 control-label">仪器ID：</label>
      <div class="col-sm-10">
        <!-- 自动接收后端传递的 instrumentId，只读模式，保留必填校验 -->
        <input name="instrumentId"
               class="form-control"
               type="text"
               th:value="${instrumentId}"
               readonly
               required
               placeholder="自动填充仪器ID">
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">计划归还时间：</label>
      <div class="col-sm-10">
        <div class="input-group date" id="planReturnTimePicker">
          <input name="planReturnTime" class="form-control" type="text" required readonly>
          <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">借用备注：</label>
      <div class="col-sm-10">
        <textarea name="remark" class="form-control" rows="3"></textarea>
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-4 col-sm-offset-2">
        <button type="submit" class="btn btn-primary">提交申请</button>
        <button type="button" class="btn btn-white" onclick="javascript:history.back()">取消</button>
      </div>
    </div>
  </form>
</div>

<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />

<script>
  $(function() {
    $('#planReturnTimePicker').datetimepicker({
      format: 'yyyy-mm-dd hh:ii:ss',
      minView: 0,
      startDate: new Date(),
      language: 'zh-CN',
      autoclose: true,
      todayBtn: true,
      todayHighlight: true
    });
    $("#borrowForm").validate({});
  });
</script>
</body>
</html>
