<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="include :: header('新增借用申请')" />
  <!-- 【修复1】确保引入日期选择器的CSS -->
  <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
  <form class="form-horizontal m-t" id="borrowForm" th:action="@{/system/borrow/add}" method="post">
    <div class="form-group">
      <label class="col-sm-2 control-label">仪器ID：</label>
      <div class="col-sm-10">
        <input name="instrumentId" class="form-control" type="text" required placeholder="请输入借用的仪器ID">
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">计划归还时间：</label>
      <div class="col-sm-10">
        <div class="input-group date" id="planReturnTimePicker">
          <!-- 【修复2】确保输入框配置正确 -->
          <input name="planReturnTime" class="form-control" type="text" required readonly>
          <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">借用备注：</label>
      <div class="col-sm-10">
        <textarea name="remark" class="form-control" rows="3"></textarea>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-4 col-sm-offset-2">
        <button type="submit" class="btn btn-primary">提交申请</button>
        <!-- 【修复3】取消按钮使用 history.back() -->
        <button type="button" class="btn btn-white" onclick="javascript:history.back()">取消</button>
      </div>
    </div>
  </form>
</div>

<th:block th:include="include :: footer" />
<!-- 【修复4】确保引入日期选择器的JS -->
<th:block th:include="include :: datetimepicker-js" />

<script>
  $(function() {
    // 【修复5】正确初始化日期时间选择器
    $('#planReturnTimePicker').datetimepicker({
      format: 'yyyy-mm-dd hh:ii:ss', // 日期时间格式
      minView: 0, // 可以选择到分钟
      startDate: new Date(), // 不能选择今天之前的日期
      language: 'zh-CN',
      autoclose: true,
      todayBtn: true,
      todayHighlight: true
    });

    // 表单验证
    $("#borrowForm").validate({});
  });
</script>
</body>
</html>
