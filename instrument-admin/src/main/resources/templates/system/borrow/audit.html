<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="include :: header('借用审核')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
  <!-- 移除同步提交 -->
  <form class="form-horizontal m-t" id="auditForm">
    <input name="borrowId" th:value="${borrow.borrowId}" type="hidden">

    <div class="form-group">
      <label class="col-sm-2 control-label">仪器名称：</label>
      <div class="col-sm-10">
        <input class="form-control" type="text" th:value="${borrow.instrumentName}" readonly>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">借用人：</label>
      <div class="col-sm-10">
        <input class="form-control" type="text" th:value="${borrow.userName}" readonly>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">计划归还时间：</label>
      <div class="col-sm-10">
        <input class="form-control" type="text" th:value="${#dates.format(borrow.planReturnTime, 'yyyy-MM-dd HH:mm:ss')}" readonly>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">审核结果：</label>
      <div class="col-sm-10">
        <select name="status" class="form-control">
          <option value="1">审核通过（借出）</option>
          <option value="3">审核驳回</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">审核意见：</label>
      <div class="col-sm-10">
        <textarea name="auditRemark" class="form-control" rows="3" required></textarea>
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-4 col-sm-offset-2">
        <button type="button" class="btn btn-primary" onclick="submitAudit()">提交审核</button>
        <button type="button" class="btn btn-white" onclick="$.modal.close()">取消</button>
      </div>
    </div>
  </form>
</div>

<th:block th:include="include :: footer" />
<script>
  $("#auditForm").validate({});

  // 异步提交审核
  function submitAudit() {
    $.operate.save("/system/borrow/audit", $("#auditForm").serialize());
  }
</script>
</body>
</html>
