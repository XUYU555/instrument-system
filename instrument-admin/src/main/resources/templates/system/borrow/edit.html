<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="include :: header('编辑借用申请')" />
  <th:block th:include="include :: datetimepicker-css" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
  <form class="form-horizontal m-t" id="borrowForm">
    <input name="borrowId" th:value="${borrow.borrowId}" type="hidden">

    <div class="form-group">
      <label class="col-sm-2 control-label">仪器ID：</label>
      <div class="col-sm-10">
        <input name="instrumentId" th:value="${borrow.instrumentId}" class="form-control" type="text" readonly required>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">计划归还时间：</label>
      <div class="col-sm-10">
        <div class="input-group date" id="planReturnTimePicker">
          <!-- 🔥 修复：添加id + 必填约束 -->
          <input id="planReturnTime" name="planReturnTime"
                 th:value="${#dates.format(borrow.planReturnTime, 'yyyy-MM-dd HH:mm:ss')}"
                 class="form-control" type="text" required readonly>
          <span class="input-group-addon"><i class="fa fa-calendar"></i></span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label class="col-sm-2 control-label">借用备注：</label>
      <div class="col-sm-10">
        <textarea name="remark" th:value="${borrow.remark}" class="form-control" rows="3"></textarea>
      </div>
    </div>

    <div class="form-group">
      <div class="col-sm-4 col-sm-offset-2">
        <button type="button" class="btn btn-primary" onclick="submitEdit()">保存修改</button>
        <button type="button" class="btn btn-white" onclick="$.modal.close()">取消</button>
      </div>
    </div>
  </form>
</div>

<th:block th:include="include :: footer" />
<th:block th:include="include :: datetimepicker-js" />

<script>
  $(function() {
    $('#planReturnTimePicker').datetimepicker({
      format: 'yyyy-mm-dd hh:ii:ss', minView:0, language:'zh-CN', autoclose:true
    });
    $("#borrowForm").validate({});
  });

  // 🔥 修复：新增日期非空判断
  function submitEdit() {
    var planReturnTime = $("#planReturnTime").val();
    if(!planReturnTime){
      $.modal.msgWarning("请选择计划归还时间！");
      return false;
    }
    $.operate.save("/system/borrow/edit", $("#borrowForm").serialize());
  }
</script>
</body>
</html>
