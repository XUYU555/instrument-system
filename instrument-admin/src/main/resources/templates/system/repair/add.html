<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:include="include :: header('新增维修申报')" />
</head>
<body class="white-bg">
<div class="wrapper wrapper-content animated fadeInRight ibox-content">
  <form class="form-horizontal m-t" id="repairForm" th:action="@{/system/repair/add}" method="post">
    <div class="form-group">
      <label class="col-sm-2 control-label">仪器ID：</label>
      <div class="col-sm-10">
        <input name="instrumentId" class="form-control" type="text" required placeholder="请输入故障仪器ID">
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">故障原因：</label>
      <div class="col-sm-10">
        <textarea name="repairReason" class="form-control" rows="3" required></textarea>
      </div>
    </div>
    <div class="form-group">
      <label class="col-sm-2 control-label">备注：</label>
      <div class="col-sm-10">
        <textarea name="remark" class="form-control" rows="2"></textarea>
      </div>
    </div>
    <div class="form-group">
      <div class="col-sm-4 col-sm-offset-2">
        <button type="submit" class="btn btn-primary">提交申报</button>
        <button type="button" class="btn btn-white" onclick="$.modal.close()">取消</button>
      </div>
    </div>
  </form>
</div>
<th:block th:include="include :: footer" />
<script>
  $("#repairForm").validate({});
</script>
</body>
</html>
